<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope - Racing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 20px;
            z-index: 10;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            display: none;
            z-index: 20;
        }

        #gameOver h1 {
            color: #ff0000;
            margin-bottom: 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #00d4ff;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 15;
        }

        .back-btn:hover {
            background: #0099ff;
        }

        #restart {
            background: #00ff00;
            color: #000;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        #restart:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Speed: <span id="speed">0</span></div>
    </div>
    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    <div id="gameOver">
        <h1>GAME OVER!</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restart">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.width = 30;
                this.height = 40;
                this.velocityX = 0;
                this.velocityY = 0;
                this.speed = 5;
            }

            update(keys) {
                if (keys['ArrowLeft'] || keys['a']) this.velocityX = -this.speed;
                if (keys['ArrowRight'] || keys['d']) this.velocityX = this.speed;
                if (keys['ArrowUp'] || keys['w']) this.velocityY = -this.speed;
                if (keys['ArrowDown'] || keys['s']) this.velocityY = this.speed;

                if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['a'] && !keys['d']) this.velocityX *= 0.9;
                if (!keys['ArrowUp'] && !keys['ArrowDown'] && !keys['w'] && !keys['s']) this.velocityY *= 0.9;

                this.x += this.velocityX;
                this.y += this.velocityY;

                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                if (this.y < 0) this.y = 0;
                if (this.y + this.height > canvas.height) this.y = canvas.height - this.height;
            }

            draw() {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#00cc00';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Obstacle {
            constructor() {
                this.x = Math.random() * (canvas.width - 40);
                this.y = -40;
                this.width = 40;
                this.height = 40;
                this.speed = 3;
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        const player = new Player();
        let obstacles = [];
        let score = 0;
        let gameRunning = true;
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function gameLoop() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                player.update(keys);
                player.draw();

                if (Math.random() < 0.02) {
                    obstacles.push(new Obstacle());
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();

                    if (checkCollision(player, obstacles[i])) {
                        gameRunning = false;
                        document.getElementById('gameOver').style.display = 'block';
                        document.getElementById('finalScore').textContent = score;
                    }

                    if (obstacles[i].y > canvas.height) {
                        obstacles.splice(i, 1);
                        score++;
                    }
                }

                document.getElementById('score').textContent = score;
                document.getElementById('speed').textContent = Math.floor(player.speed * 10);
                player.speed += 0.001;
            }

            requestAnimationFrame(gameLoop);
        }

        document.getElementById('restart').addEventListener('click', () => {
            window.location.reload();
        });

        gameLoop();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
